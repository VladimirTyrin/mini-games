syntax = "proto3";

package minigames.v2;

enum WordHuntLanguage {
  WORD_HUNT_LANGUAGE_UNSPECIFIED = 0;
  WORD_HUNT_LANGUAGE_RUSSIAN = 1;
  WORD_HUNT_LANGUAGE_ENGLISH = 2;
}

enum WordHuntPuzzleMode {
  WORD_HUNT_PUZZLE_MODE_UNSPECIFIED = 0;
  // A random answer.
  WORD_HUNT_PUZZLE_MODE_UNLIMITED = 1;
  // The word of the day, the same for every player of the language.
  WORD_HUNT_PUZZLE_MODE_DAILY = 2;
}

// Group games: who makes the first guess; turns then go round in seat order.
enum WordHuntFirstTurn {
  // Random; also what settings from before the option mean.
  WORD_HUNT_FIRST_TURN_UNSPECIFIED = 0;
  WORD_HUNT_FIRST_TURN_RANDOM = 1;
  // The host (the player in a local game).
  WORD_HUNT_FIRST_TURN_HOST_FIRST = 2;
  // The seat before the host, so the host closes the first round.
  WORD_HUNT_FIRST_TURN_HOST_LAST = 3;
}

message WordHuntSettings {
  WordHuntLanguage language = 1;
  uint32 word_length = 2;
  uint32 max_guesses = 3;
  // Every guess must reuse the letters already found.
  bool hard_mode = 4;
  WordHuntPuzzleMode mode = 5;
  // Daily puzzle only: days since 1970-01-01 in the player's time zone.
  uint32 day = 6;
  WordHuntFirstTurn first_turn = 7;
}

message WordHuntCommand {
  oneof command {
    WordHuntGuess guess = 1;
    WordHuntGiveUp give_up = 2;
  }
}

// Alone the game is lost and the word shown; in a group the seat drops out.
message WordHuntGiveUp {}

message WordHuntGuess {
  // As typed; the game normalizes case and ё.
  string word = 1;
}

message WordHuntWorldEvent {
  oneof event {
    WordHuntAnswerChosen answer_chosen = 1;
    WordHuntFirstPlayerChosen first_player_chosen = 2;
  }
}

// Group games: who guesses first.
message WordHuntFirstPlayerChosen {
  uint32 slot = 1;
}

message WordHuntAnswerChosen {
  string word = 1;
}

enum WordHuntLetterMark {
  WORD_HUNT_LETTER_MARK_UNSPECIFIED = 0;
  WORD_HUNT_LETTER_MARK_ABSENT = 1;
  // In the word, elsewhere.
  WORD_HUNT_LETTER_MARK_PRESENT = 2;
  // In the word at this position.
  WORD_HUNT_LETTER_MARK_CORRECT = 3;
}

enum WordHuntPhase {
  WORD_HUNT_PHASE_UNSPECIFIED = 0;
  // Waiting for the answer to be chosen.
  WORD_HUNT_PHASE_CHOOSING = 1;
  WORD_HUNT_PHASE_GUESSING = 2;
  WORD_HUNT_PHASE_SOLVED = 3;
  // Out of guesses.
  WORD_HUNT_PHASE_FAILED = 4;
  // Every person left.
  WORD_HUNT_PHASE_ABANDONED = 5;
  // A group game where everyone else left; the one still in play wins.
  WORD_HUNT_PHASE_FORFEITED = 6;
}

enum WordHuntBotKind {
  WORD_HUNT_BOT_KIND_UNSPECIFIED = 0;
  // Every hint, but of the last two guesses only.
  WORD_HUNT_BOT_KIND_EASY = 1;
  // Green and yellow letters of every guess; grey ones are ignored.
  WORD_HUNT_BOT_KIND_MEDIUM = 2;
  // Every hint.
  WORD_HUNT_BOT_KIND_HARD = 3;
}

message WordHuntScoredGuess {
  string word = 1;
  // One per letter of `word`.
  repeated WordHuntLetterMark marks = 2;
  // Who guessed it.
  uint32 by_slot = 3;
}

message WordHuntKeyHint {
  string letter = 1;
  WordHuntLetterMark mark = 2;
}

message WordHuntView {
  WordHuntSettings settings = 1;
  WordHuntPhase phase = 2;
  repeated WordHuntScoredGuess guesses = 3;
  // Letters guessed so far with their best mark, in alphabet order.
  repeated WordHuntKeyHint keyboard = 4;
  // Set once the game is over.
  optional string answer = 5;
  // Whose guess is next; unset before the start and after the end.
  optional uint32 turn_slot = 6;
  // Group games: who found the word (or outlasted the others).
  optional uint32 winner_slot = 7;
  // Guesses allowed in total: the setting alone, the safety cap in a group.
  uint32 guess_limit = 8;
  // Seats still in the game: not given up, not left.
  repeated uint32 playing_slots = 9;
}
