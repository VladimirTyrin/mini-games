syntax = "proto3";

package minigames.v2;

import "minigames/v2/auth.proto";
import "minigames/v2/lobby.proto";
import "minigames/v2/match.proto";
import "minigames/v2/replay.proto";

// WebSocket text frames carrying the canonical protobuf JSON mapping of these two messages.
message ClientMessage {
  // Echoed in the response (or ErrorResponse); 0 for fire-and-forget messages.
  uint32 request_id = 1;
  oneof message {
    ServerInfoRequest server_info = 10;
    Hello hello = 11;
    SignOut sign_out = 12;
    Ping ping = 13;

    ListLobbies list_lobbies = 20;
    CreateLobby create_lobby = 21;
    JoinLobby join_lobby = 22;
    LeaveLobby leave_lobby = 23;
    SetReady set_ready = 24;
    UpdateLobbySettings update_lobby_settings = 25;
    AddBot add_bot = 26;
    RemoveSeat remove_seat = 27;
    KickMember kick_member = 28;
    SwitchToObserver switch_to_observer = 29;
    SwitchToPlayer switch_to_player = 30;
    StartMatch start_match = 31;
    VotePlayAgain vote_play_again = 32;
    SendChat send_chat = 33;

    SubmitCommand submit_command = 40;
    ReportDesync report_desync = 41;
    RequestCatchUp request_catch_up = 42;
    VoteDropPlayer vote_drop_player = 43;
    LeaveMatch leave_match = 44;

    RequestReplay request_replay = 50;
    ShareReplay share_replay = 51;
    ReplayControl replay_control = 52;
  }
}

message ServerMessage {
  // Request id this message answers; 0 for pushes.
  uint32 request_id = 1;
  oneof message {
    ServerInfo server_info = 10;
    Welcome welcome = 11;
    Pong pong = 12;
    Ack ack = 13;
    ErrorResponse error = 14;
    ServerShuttingDown shutting_down = 15;

    LobbyList lobby_list = 20;
    LobbyState lobby_state = 21;
    LobbyClosed lobby_closed = 22;
    ChatMessage chat = 23;

    MatchHeader match_started = 40;
    TickFrame frame = 41;
    MatchCatchUp catch_up = 42;
    MatchPaused paused = 43;
    MatchResumed resumed = 44;
    MatchEnded ended = 45;

    ReplayData replay_data = 50;
    SharedReplay shared_replay = 51;
    ReplayControl replay_control = 52;
  }
}

message Ping {
  uint64 client_time_ms = 1;
}

message Pong {
  uint64 client_time_ms = 1;
}

message Ack {}

message ServerShuttingDown {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_INVALID_REQUEST = 2;
  ERROR_CODE_RATE_LIMITED = 3;
  // Client must update; do not reconnect automatically.
  ERROR_CODE_PROTOCOL_UNSUPPORTED = 4;
  ERROR_CODE_NOT_SIGNED_IN = 5;
  ERROR_CODE_SIGN_IN_FAILED = 6;
  ERROR_CODE_GUESTS_DISABLED = 7;
  ERROR_CODE_NAME_TAKEN = 8;
  ERROR_CODE_LOBBY_NOT_FOUND = 20;
  ERROR_CODE_LOBBY_FULL = 21;
  ERROR_CODE_NOT_HOST = 22;
  ERROR_CODE_NOT_IN_LOBBY = 23;
  ERROR_CODE_ALREADY_IN_LOBBY = 24;
  ERROR_CODE_INVALID_SETTINGS = 25;
  ERROR_CODE_NOT_READY = 26;
  ERROR_CODE_WRONG_PHASE = 27;
  ERROR_CODE_MATCH_NOT_FOUND = 40;
  ERROR_CODE_COMMAND_REJECTED = 41;
  ERROR_CODE_INVALID_REPLAY = 50;
}

message ErrorResponse {
  ErrorCode code = 1;
  // Human-readable; never parse it.
  string message = 2;
}
