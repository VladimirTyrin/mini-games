syntax = "proto3";

package minigames.v2;

import "minigames/v2/auth.proto";
import "minigames/v2/lobby.proto";
import "minigames/v2/match.proto";
import "minigames/v2/push.proto";
import "minigames/v2/refusal.proto";
import "minigames/v2/replay.proto";
import "minigames/v2/social.proto";

// WebSocket text frames carrying the canonical protobuf JSON mapping of these two messages.
message ClientMessage {
  // Echoed in the response (or ErrorResponse); 0 for fire-and-forget messages.
  uint32 request_id = 1;
  oneof message {
    ServerInfoRequest server_info = 10;
    Hello hello = 11;
    SignOut sign_out = 12;
    Ping ping = 13;

    ListLobbies list_lobbies = 20;
    CreateLobby create_lobby = 21;
    JoinLobby join_lobby = 22;
    LeaveLobby leave_lobby = 23;
    SetReady set_ready = 24;
    UpdateLobbySettings update_lobby_settings = 25;
    AddBot add_bot = 26;
    RemoveSeat remove_seat = 27;
    KickMember kick_member = 28;
    SwitchToObserver switch_to_observer = 29;
    SwitchToPlayer switch_to_player = 30;
    StartMatch start_match = 31;
    VotePlayAgain vote_play_again = 32;
    SendChat send_chat = 33;

    SubmitCommand submit_command = 40;
    ReportDesync report_desync = 41;
    RequestCatchUp request_catch_up = 42;
    VoteDropPlayer vote_drop_player = 43;
    LeaveMatch leave_match = 44;
    SubmitSecretCommand submit_secret_command = 45;

    RequestReplay request_replay = 50;
    ShareReplay share_replay = 51;
    ReplayControl replay_control = 52;

    RequestTestPush request_test_push = 60;
    RegisterPushTarget register_push_target = 61;

    ListFriends list_friends = 70;
    SendFriendRequest send_friend_request = 71;
    AnswerFriendRequest answer_friend_request = 72;
    RemoveFriend remove_friend = 73;
    CreateFriendLink create_friend_link = 74;
    RevokeFriendLink revoke_friend_link = 75;
    UseFriendLink use_friend_link = 76;
    InviteFriend invite_friend = 77;
    CancelInvite cancel_invite = 78;
    AnswerInvite answer_invite = 79;
  }
}

message ServerMessage {
  // Request id this message answers; 0 for pushes.
  uint32 request_id = 1;
  oneof message {
    ServerInfo server_info = 10;
    Welcome welcome = 11;
    Pong pong = 12;
    Ack ack = 13;
    ErrorResponse error = 14;
    ServerShuttingDown shutting_down = 15;
    ServerUpdating server_updating = 16;

    LobbyList lobby_list = 20;
    LobbyState lobby_state = 21;
    LobbyClosed lobby_closed = 22;
    ChatMessage chat = 23;

    MatchHeader match_started = 40;
    TickFrame frame = 41;
    MatchCatchUp catch_up = 42;
    MatchPaused paused = 43;
    MatchResumed resumed = 44;
    MatchEnded ended = 45;
    MatchSeatSecret seat_secret = 46;

    ReplayData replay_data = 50;
    SharedReplay shared_replay = 51;
    ReplayControl replay_control = 52;

    FriendList friend_list = 70;
    FriendPresence friend_presence = 71;
    FriendLink friend_link = 72;
    InviteUpdate invite_update = 73;
    GameInvite game_invite = 74;
    GameInviteClosed game_invite_closed = 75;
  }
}

message Ping {
  uint64 client_time_ms = 1;
}

message Pong {
  uint64 client_time_ms = 1;
}

message Ack {}

message ServerShuttingDown {}

// Pushed to everyone (and to every later sign-in) once the server is waiting to restart for an
// update: matches already running are played out, new ones are refused with
// ERROR_CODE_SERVER_UPDATING until the new server is up.
message ServerUpdating {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_INVALID_REQUEST = 2;
  ERROR_CODE_RATE_LIMITED = 3;
  // Client must update; do not reconnect automatically.
  ERROR_CODE_PROTOCOL_UNSUPPORTED = 4;
  ERROR_CODE_NOT_SIGNED_IN = 5;
  ERROR_CODE_SIGN_IN_FAILED = 6;
  ERROR_CODE_GUESTS_DISABLED = 7;
  // Was NAME_TAKEN: display names are labels and need not be unique.
  reserved 8;
  reserved "ERROR_CODE_NAME_TAKEN";
  // Pushed (request_id 0) to a connection whose session was taken over: resumed from another
  // connection (a duplicated tab), or a bot's key signed in again. The server closes it next.
  // Do not reconnect automatically: the two would keep taking over.
  ERROR_CODE_SIGNED_IN_ELSEWHERE = 9;
  // A match cannot start while the server waits to restart for an update (see ServerUpdating).
  ERROR_CODE_SERVER_UPDATING = 10;
  ERROR_CODE_LOBBY_NOT_FOUND = 20;
  ERROR_CODE_LOBBY_FULL = 21;
  ERROR_CODE_NOT_HOST = 22;
  ERROR_CODE_NOT_IN_LOBBY = 23;
  ERROR_CODE_ALREADY_IN_LOBBY = 24;
  ERROR_CODE_INVALID_SETTINGS = 25;
  ERROR_CODE_NOT_READY = 26;
  ERROR_CODE_WRONG_PHASE = 27;
  ERROR_CODE_MATCH_NOT_FOUND = 40;
  ERROR_CODE_COMMAND_REJECTED = 41;
  ERROR_CODE_INVALID_REPLAY = 50;
  // This server has no credentials for that kind of push target.
  ERROR_CODE_PUSH_UNAVAILABLE = 60;
  // Friends and invitations need a Google account.
  ERROR_CODE_ACCOUNT_REQUIRED = 70;
  ERROR_CODE_NOT_FRIENDS = 71;
  ERROR_CODE_FRIEND_LINK_INVALID = 72;
  ERROR_CODE_INVITE_CLOSED = 73;
  ERROR_CODE_ACCOUNT_NOT_FOUND = 74;
}

message ErrorResponse {
  ErrorCode code = 1;
  // English, for logs, bots and the console; never parse it and never show it to a player: the
  // client words the code, `refusal` or `setting_problem` in the player's language.
  string message = 2;
  // With ERROR_CODE_COMMAND_REJECTED: why the command (or private command) was refused.
  Refusal refusal = 3;
  // With ERROR_CODE_INVALID_SETTINGS when one setting is at fault; absent when the problem is
  // the whole request (an unknown game, a seat count the game does not support).
  SettingProblem setting_problem = 4;
}
