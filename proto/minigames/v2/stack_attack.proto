syntax = "proto3";

package minigames.v2;

// Coordinates: x is the column, y the row with y = 0 at the floor (grows towards the cranes).
// Ids of boxes and cranes are assigned in creation order and never reused, so renderers can match
// entities between consecutive views to interpolate their movement.

message StackAttackSettings {
  uint32 field_width = 1;
  uint32 field_height = 2;
}

enum StackAttackDirection {
  STACK_ATTACK_DIRECTION_UNSPECIFIED = 0;
  STACK_ATTACK_DIRECTION_LEFT = 1;
  STACK_ATTACK_DIRECTION_RIGHT = 2;
}

// Queued (at most 3 per worker); each tick executes one queued command per worker.
message StackAttackCommand {
  oneof command {
    StackAttackMove move = 1;
    StackAttackJump jump = 2;
  }
}

message StackAttackMove {
  StackAttackDirection direction = 1;
}

message StackAttackJump {}

enum StackAttackSide {
  STACK_ATTACK_SIDE_UNSPECIFIED = 0;
  STACK_ATTACK_SIDE_LEFT = 1;
  STACK_ATTACK_SIDE_RIGHT = 2;
}

message StackAttackWorldEvent {
  oneof event {
    StackAttackCraneSpawn crane_spawn = 1;
  }
}

message StackAttackCraneSpawn {
  int32 target_x = 1;
  StackAttackSide from_side = 2;
  // 0..8
  uint32 pattern_id = 3;
}

message StackAttackCell {
  int32 x = 1;
  int32 y = 2;
}

enum StackAttackWorkerState {
  STACK_ATTACK_WORKER_STATE_UNSPECIFIED = 0;
  STACK_ATTACK_WORKER_STATE_GROUNDED = 1;
  // Just jumped: hangs one tick before falling.
  STACK_ATTACK_WORKER_STATE_JUMPING = 2;
  STACK_ATTACK_WORKER_STATE_FALLING = 3;
}

enum StackAttackWorkerStatus {
  STACK_ATTACK_WORKER_STATUS_UNSPECIFIED = 0;
  STACK_ATTACK_WORKER_STATUS_ALIVE = 1;
  STACK_ATTACK_WORKER_STATUS_CRUSHED = 2;
  STACK_ATTACK_WORKER_STATUS_LEFT = 3;
}

// The worker colour derives from `slot`.
message StackAttackWorker {
  uint32 slot = 1;
  // The worker also occupies the cell above its feet.
  StackAttackCell feet = 2;
  StackAttackWorkerState state = 3;
  StackAttackWorkerStatus status = 4;
  uint32 queued_commands = 5;
}

message StackAttackBox {
  uint32 id = 1;
  StackAttackCell cell = 2;
  uint32 pattern_id = 3;
  bool falling = 4;
}

enum StackAttackCraneState {
  STACK_ATTACK_CRANE_STATE_UNSPECIFIED = 0;
  // Travelling to the target column, or waiting above it until the top cell is free.
  STACK_ATTACK_CRANE_STATE_MOVING = 1;
  // Released its box this tick.
  STACK_ATTACK_CRANE_STATE_DROPPING = 2;
  STACK_ATTACK_CRANE_STATE_LEAVING = 3;
}

message StackAttackCrane {
  uint32 id = 1;
  // -1 and field_width are the off-field columns where cranes enter and leave.
  int32 x = 2;
  int32 target_x = 3;
  StackAttackCraneState state = 4;
  uint32 pattern_id = 5;
}

enum StackAttackEndReason {
  STACK_ATTACK_END_REASON_UNSPECIFIED = 0;
  // No worker is alive and the last one was crushed.
  STACK_ATTACK_END_REASON_WORKERS_CRUSHED = 1;
  STACK_ATTACK_END_REASON_CEILING_REACHED = 2;
  // No worker is alive and the last one left.
  STACK_ATTACK_END_REASON_ALL_WORKERS_LEFT = 3;
}

// What happened during the latest frame, for animations and sounds.
message StackAttackEvent {
  oneof event {
    StackAttackCraneSpawnedEvent crane_spawned = 1;
    StackAttackBoxDroppedEvent box_dropped = 2;
    StackAttackBoxLandedEvent box_landed = 3;
    StackAttackBoxPushedEvent box_pushed = 4;
    StackAttackWorkerJumpedEvent worker_jumped = 5;
    StackAttackWorkerLandedEvent worker_landed = 6;
    StackAttackWorkerCrushedEvent worker_crushed = 7;
    StackAttackWorkerLeftEvent worker_left = 8;
    StackAttackLinesClearedEvent lines_cleared = 9;
    StackAttackBoxBrokenEvent box_broken = 10;
  }
}

message StackAttackCraneSpawnedEvent {
  uint32 crane_id = 1;
  int32 start_x = 2;
  int32 target_x = 3;
}

message StackAttackBoxDroppedEvent {
  uint32 crane_id = 1;
  uint32 box_id = 2;
  int32 x = 3;
}

message StackAttackBoxLandedEvent {
  uint32 box_id = 1;
  StackAttackCell cell = 2;
}

message StackAttackBoxPushedEvent {
  uint32 box_id = 1;
  int32 from_x = 2;
  int32 to_x = 3;
  uint32 by_slot = 4;
}

message StackAttackWorkerJumpedEvent {
  uint32 slot = 1;
}

message StackAttackWorkerLandedEvent {
  uint32 slot = 1;
  StackAttackCell feet = 2;
}

message StackAttackWorkerCrushedEvent {
  uint32 slot = 1;
  uint32 box_id = 2;
}

message StackAttackWorkerLeftEvent {
  uint32 slot = 1;
}

// One per tick however many rows were cleared; `points` is exactly what was added to the score.
message StackAttackLinesClearedEvent {
  repeated int32 rows = 1;
  uint32 points = 2;
}

// A jumping worker's head broke a falling box (landed boxes and boxes on a crane cannot be broken).
message StackAttackBoxBrokenEvent {
  uint32 box_id = 1;
  // Where the box was when hit: the cell the head rose into or the one above it.
  StackAttackCell cell = 2;
  uint32 by_slot = 3;
}

message StackAttackView {
  // Unset for spectators.
  optional uint32 you = 1;
  uint32 field_width = 2;
  uint32 field_height = 3;
  uint32 tick_ms = 4;
  // Indexed by seat, including crushed and departed workers.
  repeated StackAttackWorker workers = 5;
  // Sorted by id.
  repeated StackAttackBox boxes = 6;
  repeated StackAttackCrane cranes = 7;
  // Team score, shared by every seat.
  uint32 score = 8;
  uint32 lines_cleared = 9;
  uint32 boxes_pushed = 10;
  uint32 level = 11;
  // Survival time; multiply by tick_ms for wall time.
  uint64 ticks_survived = 12;
  repeated StackAttackEvent events = 13;
  // Unset while the game is running.
  optional StackAttackEndReason end_reason = 14;
}
