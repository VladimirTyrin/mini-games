syntax = "proto3";

package minigames.v2;

enum IdentityKind {
  IDENTITY_KIND_UNSPECIFIED = 0;
  IDENTITY_KIND_GUEST = 1;
  IDENTITY_KIND_GOOGLE = 2;
  // Network bot authenticated with a server-issued key.
  IDENTITY_KIND_BOT_CLIENT = 3;
  // Built-in bot seated by a lobby host; never has a connection.
  IDENTITY_KIND_BUILT_IN_BOT = 4;
}

// A player is identified by `id`; `display_name` is only a label and several players may share
// it. Compare players by `id`, never by name.
message Identity {
  IdentityKind kind = 1;
  // Opaque and unique among players online; the prefix tells the kind:
  // `g_…` Google account (derived from the account, the same on every session and device),
  // `b_…` network bot (the same for its key), `u_…` guest (one session),
  // `bot-N` built-in bot (one lobby).
  string id = 2;
  string display_name = 3;
  // Profile picture: an https URL hosted by Google (googleusercontent.com), Google accounts
  // only. Empty = no avatar.
  string avatar_url = 4;
}
