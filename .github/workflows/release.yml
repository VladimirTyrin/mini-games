name: Release

# Bumping `[workspace.package] version` in Cargo.toml on master publishes the GitHub Release
# `v<version>` with the Android APK (plus web.json and the zip of its over-the-air web bundle),
# the server binary and the web bundle; the workflow creates the tag. It runs after every CI run
# on master and only when that run succeeded, on exactly the commit CI checked; the few-second
# version check skips versions that already have a tag, so a release blocked by a red CI goes
# out with the next green push. A manual run builds the same files as workflow artifacts without
# publishing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      # false when this version already has its release tag.
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: read
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -z "$version" ]]; then
            echo "::error::no [workspace.package] version in Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The build number is the commit count, which needs the full history.
          fetch-depth: 0
      - uses: ./.github/actions/setup-web
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::secret ANDROID_RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MG_ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: node build/android.mjs apk release
        env:
          MG_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          MG_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MG_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      # The over-the-air web bundle keeps its names: web.json refers to the zip by name.
      - run: |
          cp android/dist/mini-games.apk "$RUNNER_TEMP/mini-games-${{ needs.version.outputs.version }}.apk"
          cp android/dist/web.json android/dist/web-*.zip "$RUNNER_TEMP/"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            ${{ runner.temp }}/mini-games-*.apk
            ${{ runner.temp }}/web.json
            ${{ runner.temp }}/web-*.zip
          if-no-files-found: error

  server:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p mg-server
      - run: |
          name="mini-games-server-${{ needs.version.outputs.version }}-x86_64-linux"
          mkdir "$RUNNER_TEMP/$name"
          cp target/x86_64-unknown-linux-musl/release/mini_games_server "$RUNNER_TEMP/$name/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: ${{ runner.temp }}/mini-games-server-*.tar.gz
          if-no-files-found: error

  web:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-web
      # No VITE_SERVER_URL: the server-hosted bundle connects to the host that served it.
      - run: npm run build
      - run: tar -C dist -czf "$RUNNER_TEMP/mini-games-web-${{ needs.version.outputs.version }}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ runner.temp }}/mini-games-web-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, android, server, web]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
