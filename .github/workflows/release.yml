name: Release

# A `v*` tag publishes a GitHub Release with the Android APK, the server binary and the web
# bundle. A manual run builds the same files as workflow artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::secret ANDROID_RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MG_ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: node build/android.mjs apk release
        env:
          MG_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          MG_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MG_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mini-games-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/mini-games-*.apk
          if-no-files-found: error

  server:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p mg-server
      - run: |
          name="mini-games-server-${{ needs.version.outputs.version }}-x86_64-linux"
          mkdir "$RUNNER_TEMP/$name"
          cp target/x86_64-unknown-linux-musl/release/mini_games_server "$RUNNER_TEMP/$name/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: ${{ runner.temp }}/mini-games-server-*.tar.gz
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      # No VITE_SERVER_URL: the server-hosted bundle connects to the host that served it.
      - run: npm run build
      - run: tar -C dist -czf "$RUNNER_TEMP/mini-games-web-${{ needs.version.outputs.version }}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ runner.temp }}/mini-games-web-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, android, server, web]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
