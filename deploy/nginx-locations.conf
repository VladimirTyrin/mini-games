# Shared locations (included by the http and tls server blocks).

root /opt/mini-games-server/web;
index index.html;

location /ws {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Clients ping every 15 s; the server drops silent connections after 45 s.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

location /healthz {
    proxy_pass http://127.0.0.1:5000;
}

# Hashed file names: safe to cache forever.
location /assets/ {
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip_static on;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}

gzip on;
gzip_types application/javascript application/wasm text/css image/svg+xml;
