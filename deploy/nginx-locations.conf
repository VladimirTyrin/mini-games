# Shared locations (included by the http and tls server blocks).

root /opt/mini-games-server/web;
index index.html;

include /etc/nginx/snippets/mini-games-ws.conf;

# Survives redeploys (the web root is replaced on every deploy).
location /downloads/ {
    alias /opt/mini-games-server/downloads/;
    types {
        application/vnd.android.package-archive apk;
        application/json json;
    }
    add_header Cache-Control "no-cache";
    # The app (origin https://localhost) reads android.json to offer updates.
    add_header Access-Control-Allow-Origin "*";
}

location /healthz {
    proxy_pass http://127.0.0.1:5000;
}

# Hashed file names: safe to cache forever.
location /assets/ {
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip_static on;
    try_files $uri =404;
}

# The v1 client lived under /ui; old bookmarks land on the app.
location ~ ^/ui(/|$) {
    return 301 /;
}

# Routes live in the URL hash, so only real files are served; anything else is a 404.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

gzip on;
gzip_types application/javascript application/wasm text/css image/svg+xml;
