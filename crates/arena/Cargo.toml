[package]
name = "mg-arena"
description = "Local bot tournaments: matches between built-in bots through the registry authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mg-arena"
path = "src/main.rs"

[dependencies]
mg-core.workspace = true
mg-protocol = { workspace = true, features = ["json"] }
mg-registry = { workspace = true, features = ["json"] }
clap.workspace = true
prost.workspace = true
serde_json = "1"
thiserror = "2"
