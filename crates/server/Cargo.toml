[package]
name = "mg-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mini_games_server"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
hmac = "0.13"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tracing = "0.1.44"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
