[package]
name = "mg-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mini_games_server"
path = "src/main.rs"

[dependencies]
mg-core.workspace = true
mg-protocol = { workspace = true, features = ["json"] }
mg-registry.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
mimalloc = "0.1.52"
prost.workspace = true
rand.workspace = true
tokio.workspace = true
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23"
hmac = "0.13"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tracing = "0.1.44"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
mg-snake.workspace = true
mg-tictactoe.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.30"
