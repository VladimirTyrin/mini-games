[workspace]
members = [
    "crates/arena",
    "crates/bot-sdk",
    "crates/core",
    "crates/ffi",
    "crates/games/*",
    "crates/protocol",
    "crates/registry",
    "crates/server",
    "crates/wasm",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
large_enum_variant = "allow"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Browser bundle: optimise the WASM core for size.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
panic = "abort"
# wasm-bindgen reads the target-features section; wasm-opt strips symbols afterwards.
strip = false

[profile.bench]
debug = true

[workspace.dependencies]
mg-core = { path = "crates/core" }
mg-protocol = { path = "crates/protocol" }
mg-registry = { path = "crates/registry" }
mg-snake = { path = "crates/games/snake" }
mg-tictactoe = { path = "crates/games/tictactoe" }
mg-stack-attack = { path = "crates/games/stack-attack" }
mg-puzzle2048 = { path = "crates/games/puzzle2048" }
mg-numbers-match = { path = "crates/games/numbers-match" }
mg-word-hunt = { path = "crates/games/word-hunt" }
mg-checkers = { path = "crates/games/checkers" }
mg-sea-battle = { path = "crates/games/sea-battle" }
# xtask:game-crates

clap = { version = "4.6", features = ["derive", "env"] }
prost = "0.14.6"
protoc-bin-vendored = "3.2.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
